<script>
function generarPoisson() {
    const cantidad = parseInt(document.getElementById("cantidad").value);
    const lambda = parseFloat(document.getElementById("lambda").value);

    if (isNaN(cantidad) || isNaN(lambda) || cantidad <= 0 || lambda <= 0) {
        alert("Ingrese valores válidos. λ debe ser mayor que 0.");
        return;
    }

    let html = "<table>";
    html += "<tr>";
    html += "<th>i</th>";
    html += "<th>λ</th>";
    html += "<th>N</th>";
    html += "<th>T</th>";
    html += "<th>r<sub>i</sub></th>";
    html += "<th>T'</th>";
    html += "<th>e<sup>−λ</sup></th>";
    html += "<th>P<sub>i</sub></th>";
    html += "</tr>";

    const limite = Math.exp(-lambda);

    // Generar la cantidad de variables Poisson solicitadas
    for (let i = 1; i <= cantidad; i++) {

        // Reiniciar el proceso para cada P_i
        let N = 0;
        let T = 1;

        let r;
        let Tprima;

        // Proceso de generación de una variable Poisson
        do {
            r = Math.random();
            Tprima = T * r;

            if (Tprima >= limite) {
                N = N + 1;
                T = Tprima;
            }

        } while (Tprima >= limite);

        // Una sola fila representa cada P_i terminado
        html += "<tr>";
        html += `<td>${i}</td>`;
        html += `<td>${lambda}</td>`;
        html += `<td>${N}</td>`;
        html += `<td>${T.toFixed(6)}</td>`;
        html += `<td>${r.toFixed(6)}</td>`;
        html += `<td>${Tprima.toFixed(6)}</td>`;
        html += `<td>${limite.toFixed(6)}</td>`;
        html += `<td><strong>${N}</strong></td>`;
        html += "</tr>";
    }

    html += "</table>";

    document.getElementById("resultados").innerHTML = html;
}
</script>
