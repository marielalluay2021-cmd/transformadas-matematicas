<script>

    // Guarda todos los números que ya fueron utilizados
    let usados = new Set();


    // Genera un número entre 0 y 1 sin repetir
    function generarAleatorioSinRepetir() {

        let r;

        do {

            // Genera números entre 0.000001 y 0.999999
            r =
                Math.floor(
                    Math.random() * 999999
                ) + 1;

            r = r / 1000000;

        } while (
            usados.has(r)
        );

        // Guarda el número para evitar que vuelva a salir
        usados.add(r);

        return r;
    }


    function generarVariables() {

        const cantidad =
            parseInt(
                document.getElementById("cantidad").value
            );

        const lambda =
            parseFloat(
                document.getElementById("lambda").value
            );

        const k =
            parseInt(
                document.getElementById("k").value
            );

        const resultados =
            document.getElementById("resultados");


        /* VALIDACIONES */

        if (
            !Number.isInteger(cantidad)
            ||
            cantidad < 1
        ) {

            alert(
                "La cantidad debe ser un número entero mayor que 0."
            );

            return;

        }


        if (
            !Number.isFinite(lambda)
            ||
            lambda <= 0
        ) {

            alert(
                "El valor de λ debe ser mayor que 0."
            );

            return;

        }


        if (
            !Number.isInteger(k)
            ||
            k < 1
        ) {

            alert(
                "El parámetro k debe ser un número entero mayor que 0."
            );

            return;

        }


        /*
            Se reinician los números utilizados
            cada vez que se genera una nueva tabla.
        */

        usados.clear();


        /* ENCABEZADO DE TABLA */

        let tabla = `

            <div class="tabla-contenedor">

            <table>

                <tr>

                    <th>i</th>

        `;


        for (
            let j = 1;
            j <= k;
            j++
        ) {

            tabla += `

                <th>r${j}</th>

            `;

        }


        tabla += `

                    <th>ERᵢ</th>

                </tr>

        `;


        /* GENERACIÓN */

        for (
            let i = 1;
            i <= cantidad;
            i++
        ) {


            let producto = 1;


            let fila = `

                <tr>

                    <td>${i}</td>

            `;


            for (
                let j = 1;
                j <= k;
                j++
            ) {


                // Generar número entre 0 y 1 sin repetir
                let r =
                    generarAleatorioSinRepetir();


                // Multiplicación para Erlang
                producto *=
                    (1 - r);


                fila += `

                    <td>
                        ${r.toFixed(6)}
                    </td>

                `;

            }


            /*
                Fórmula:

                ERᵢ =
                -1/(kλ) × ln(producto)
            */

            const ER =
                -(
                    1 /
                    (k * lambda)
                )
                *
                Math.log(producto);


            fila += `

                    <td>
                        ${ER.toFixed(6)}
                    </td>

                </tr>

            `;


            tabla += fila;

        }


        tabla += `

            </table>

            </div>

        `;


        resultados.innerHTML =
            tabla;

    }


    /* COPIAR A EXCEL */

    function copiarExcel() {


        const tabla =
            document.querySelector(
                "#resultados table"
            );


        if (!tabla) {

            alert(
                "Primero genera las variables."
            );

            return;

        }


        let texto = "";


        const filas =
            tabla.querySelectorAll("tr");


        filas.forEach(
            fila => {


                const celdas =
                    fila.querySelectorAll(
                        "th, td"
                    );


                const datos = [];


                celdas.forEach(
                    celda => {

                        datos.push(
                            celda.innerText
                        );

                    }
                );


                texto +=
                    datos.join("\t")
                    +
                    "\n";

            }
        );


        navigator.clipboard.writeText(
            texto
        );


        alert(
            "Datos copiados. Ahora puedes pegarlos en Excel."
        );

    }

</script>
